name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    name: Build, Lint, Typecheck, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run

      - name: Build production bundle (Cloudflare)
        run: npm run build

      - name: Build production bundle (GitHub Pages)
        run: GITHUB_PAGES=true npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Upload Cloudflare artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-cloudflare
          path: app/dist
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-github-pages
          path: app/dist
          retention-days: 7

  deploy-cloudflare-preview:
    name: Deploy Preview (Cloudflare Pages)
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Cloudflare artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-cloudflare
          path: app/dist

      - name: Deploy to Cloudflare Pages Preview
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: cuk-timetable
          directory: app/dist
          branch: preview-${{ github.event.pull_request.number }}

  deploy-cloudflare-production:
    name: Deploy Production (Cloudflare Pages)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Cloudflare artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-cloudflare
          path: app/dist

      - name: Deploy to Cloudflare Pages Production
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: cuk-timetable
          directory: app/dist
          branch: main

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GitHub Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-github-pages
          path: app/dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
