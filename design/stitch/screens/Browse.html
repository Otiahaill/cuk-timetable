  <script>
    let currentFilter = 'all';

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-chip').forEach(function (btn) {
        const active = btn.dataset.filter === f;
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        btn.className = active
          ? 'filter-chip inline-flex items-center justify-center min-h-[48px] px-gutter-lg rounded-full bg-light-primary dark:bg-dark-primary text-light-on-primary dark:text-dark-on-primary font-label text-label-md whitespace-nowrap'
          : 'filter-chip inline-flex items-center justify-center min-h-[48px] px-gutter-lg rounded-full bg-light-surface-container-low dark:bg-dark-surface-container-low text-light-on-surface dark:text-dark-on-surface border border-light-outline-variant dark:border-dark-outline-variant font-label text-label-md whitespace-nowrap';
      });
      filterBrowse();
    }

    function filterBrowse() {
      const q = document.getElementById('browse-search').value.toLowerCase();
      document.querySelectorAll('.browse-card').forEach(function (card) {
        const meta = card.dataset.meta.toLowerCase();
        const matchesQuery = !q || meta.indexOf(q) !== -1;
        const matchesChip = currentFilter === 'all' || meta.indexOf(currentFilter.toLowerCase()) !== -1;
        card.classList.toggle('hidden', !(matchesQuery && matchesChip));
      });
    }

    function openSheet(time, title, sub, mode) {
      document.getElementById('sheet-time').textContent = time;
      document.getElementById('sheet-title').textContent = title;
      document.getElementById('sheet-sub').textContent = sub;
      document.getElementById('sheet-mode').textContent = mode;
      document.getElementById('sheet-backdrop').classList.remove('hidden');
      document.getElementById('detail-sheet').classList.remove('hidden');
    }

    function closeSheet() {
      document.getElementById('sheet-backdrop').classList.add('hidden');
      document.getElementById('detail-sheet').classList.add('hidden');
    }
  </script>
