    };

    function selectDay(day) {
      document.querySelectorAll('.day-chip').forEach(function (btn) {
        const active = btn.dataset.day === day;
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
        btn.className = active
          ? 'day-chip min-h-[48px] rounded-full bg-light-primary dark:bg-dark-primary text-light-on-primary dark:text-dark-on-primary font-label text-label-md'
          : 'day-chip min-h-[48px] rounded-full bg-light-surface-container-low dark:bg-dark-surface-container-low text-light-on-surface dark:text-dark-on-surface border border-light-outline-variant dark:border-dark-outline-variant font-label text-label-md';
      });
      const container = document.getElementById('week-timeline');
      container.innerHTML = DAYS[day].map(function (item) {
        if (item.type === 'gap') {
          return '<div class="flex items-center justify-between px-gutter-lg py-gutter-md rounded-lg bg-light-surface-container dark:bg-dark-surface-container border border-light-outline-variant dark:border-dark-outline-variant"><span data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant dark:text-dark-on-surface-variant">' + item.label + '</span><span data-design-text-token="label-md" class="font-label text-label-md text-light-outline dark:text-dark-outline tabular-nums">' + item.time + '</span></div>';
        }
        if (item.type === 'clash') {
          return '<button type="button" onclick="openSheet(\'' + item.time + '\',\'' + item.title + '\',\'' + item.sub + '\',\'' + item.mode + ' · Clash\')" class="w-full text-left p-gutter-lg rounded-lg bg-light-surface-container-low dark:bg-dark-surface-container-low border-2 border-light-error dark:border-dark-error flex flex-col gap-gutter-sm active:opacity-80"><header class="flex items-center justify-between gap-gutter-sm w-full"><span data-design-text-token="title-lg" class="font-headline text-title-lg text-light-on-surface dark:text-dark-on-surface tabular-nums">' + item.time + '</span><span data-design-text-token="label-sm" class="inline-flex items-center gap-gutter-xs px-gutter-sm py-gutter-xs rounded-full bg-light-error-container dark:bg-dark-error-container text-light-on-error-container dark:text-dark-on-error-container font-label text-label-sm"><span class="material-symbols-outlined text-[14px]" aria-hidden="true">warning</span>Clash</span></header><div><h3 data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface dark:text-dark-on-surface">' + item.title + '</h3><p data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant dark:text-dark-on-surface-variant">' + item.sub + '</p></div><p data-design-text-token="label-md" class="font-label text-label-md text-light-error dark:text-dark-error">' + item.clash + '</p></button>';
        }
        return '<button type="button" onclick="openSheet(\'' + item.time + '\',\'' + item.title + '\',\'' + item.sub + '\',\'' + item.mode + '\')" class="w-full text-left p-gutter-lg rounded-lg bg-light-surface-container-low dark:bg-dark-surface-container-low border border-light-outline-variant dark:border-dark-outline-variant flex flex-col gap-gutter-sm active:opacity-80"><header class="flex items-center justify-between gap-gutter-sm w-full"><span data-design-text-token="title-lg" class="font-headline text-title-lg text-light-on-surface dark:text-dark-on-surface tabular-nums">' + item.time + '</span><span data-design-text-token="label-sm" class="px-gutter-sm py-gutter-xs rounded-full bg-light-secondary-container dark:bg-dark-secondary-container text-light-on-secondary-container dark:text-dark-on-secondary-container font-label text-label-sm">' + item.mode + '</span></header><div><h3 data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface dark:text-dark-on-surface">' + item.title + '</h3><p data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant dark:text-dark-on-surface-variant">' + item.sub + '</p></div></button>';
      }).join('');
    }

    function toggleGlance() {
      const strip = document.getElementById('glance-strip');
      const btn = document.getElementById('glance-toggle-btn');
      const hidden = strip.classList.toggle('hidden');
      btn.setAttribute('aria-pressed', hidden ? 'false' : 'true');
    }

    function openSheet(time, title, sub, mode) {
      document.getElementById('sheet-time').textContent = time;
      document.getElementById('sheet-title').textContent = title;
      document.getElementById('sheet-sub').textContent = sub;
      document.getElementById('sheet-mode').textContent = mode;
      document.getElementById('sheet-backdrop').classList.remove('hidden');
      document.getElementById('detail-sheet').classList.remove('hidden');
    }

    function closeSheet() {
      document.getElementById('sheet-backdrop').classList.add('hidden');
      document.getElementById('detail-sheet').classList.add('hidden');
    }
  </script>


</body></html>
