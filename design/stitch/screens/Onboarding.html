  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&amp;family=Geist:wght@400;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-light-background dark:bg-dark-background text-light-on-background dark:text-dark-on-background font-body antialiased">
  <div class="max-w-[430px] mx-auto min-h-[884px] flex flex-col justify-between bg-light-surface dark:bg-dark-surface text-light-on-surface dark:text-dark-on-surface px-page-margin py-gutter-xl" data-stitch-vh="min-h-[884px]===min-h-screen">

    <!-- Progress Dots -->
    <header class="flex items-center justify-between gap-gutter-sm">
      <div class="flex items-center gap-gutter-sm" aria-label="Step 1 of 3">
        <span id="dot-1" class="w-[24px] h-[8px] rounded-full bg-light-primary dark:bg-dark-primary"></span>
        <span id="dot-2" class="w-[8px] h-[8px] rounded-full bg-light-outline-variant dark:bg-dark-outline-variant"></span>
        <span id="dot-3" class="w-[8px] h-[8px] rounded-full bg-light-outline-variant dark:bg-dark-outline-variant"></span>
      </div>
      <a href="../today/Today.html" class="inline-flex items-center justify-center min-h-[48px] px-gutter-sm font-label text-label-md text-light-on-surface-variant dark:text-dark-on-surface-variant">Skip</a>
    </header>

    <!-- Step 1: Pick Course -->
    <main id="step-1" class="flex-1 flex flex-col justify-center gap-gutter-lg py-gutter-lg">
      <div class="flex flex-col gap-gutter-xs">
        <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-light-on-surface dark:text-dark-on-surface text-balance">Pick your course</h1>
        <p data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant dark:text-dark-on-surface-variant">We only download classes for your degree to save data.</p>
      </div>

      <form role="search" onsubmit="event.preventDefault()" class="flex items-center w-full min-h-[48px] px-gutter-md rounded-lg bg-light-surface-container-high dark:bg-dark-surface-container-high border border-light-outline-variant dark:border-dark-outline-variant focus-within:border-light-primary dark:focus-within:border-dark-primary">
        <span class="material-symbols-outlined text-[22px] text-light-on-surface-variant dark:text-dark-on-surface-variant mr-gutter-sm" aria-hidden="true">search</span>
        <input id="course-search" type="search" autofocus aria-label="Search your course" placeholder="Search BSc Computer Science..." oninput="filterCourses()" class="w-full bg-transparent border-0 p-0 text-body-md text-light-on-surface dark:text-dark-on-surface placeholder:text-light-outline dark:placeholder:text-dark-outline focus:ring-0">
      </form>

      <div class="flex flex-col gap-gutter-sm">
        <button type="button" onclick="pickCourse(&#39;BSc Computer Science · Y3&#39;)" class="course-option min-h-[48px] w-full text-left px-gutter-lg py-gutter-md rounded-lg bg-light-primary-container dark:bg-dark-primary-container text-light-on-primary-container dark:text-dark-on-primary-container font-title text-title-md">BSc Computer Science · Year 3</button>
        <button type="button" onclick="pickCourse(&#39;BSc Software Engineering · Y2&#39;)" class="course-option min-h-[48px] w-full text-left px-gutter-lg py-gutter-md rounded-lg bg-light-surface-container-low dark:bg-dark-surface-container-low text-light-on-surface dark:text-dark-on-surface border border-light-outline-variant dark:border-dark-outline-variant font-title text-title-md">BSc Software Engineering · Year 2</button>
        <button type="button" onclick="pickCourse(&#39;BSc Data Science · Y3&#39;)" class="course-option min-h-[48px] w-full text-left px-gutter-lg py-gutter-md rounded-lg bg-light-surface-container-low dark:bg-dark-surface-container-low text-light-on-surface dark:text-dark-on-surface border border-light-outline-variant dark:border-dark-outline-variant font-title text-title-md">BSc Data Science · Year 3</button>
      </div>
    </main>

    <!-- Step 2: Tick Units -->
    <main id="step-2" class="hidden flex-1 flex flex-col justify-center gap-gutter-lg py-gutter-lg">
      <div class="flex flex-col gap-gutter-xs">
        <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-light-on-surface dark:text-dark-on-surface text-balance">Tick your units</h1>
        <p data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant dark:text-dark-on-surface-variant">Select the classes you are taking this semester.</p>
      </div>
      <div class="flex flex-col gap-gutter-sm">
        <label class="flex items-center justify-between min-h-[48px] px-gutter-lg py-gutter-md rounded-lg bg-light-surface-container-low dark:bg-dark-surface-container-low border border-light-outline-variant dark:border-dark-outline-variant cursor-pointer">
          <span data-design-text-token="title-md" class="font-title text-title-md">CSC 301 · Data Structures</span>
          <input type="checkbox" checked class="w-[24px] h-[24px] rounded text-light-primary dark:text-dark-primary focus:ring-0">
        </label>
        <label class="flex items-center justify-between min-h-[48px] px-gutter-lg py-gutter-md rounded-lg bg-light-surface-container-low dark:bg-dark-surface-container-low border border-light-outline-variant dark:border-dark-outline-variant cursor-pointer">
          <span data-design-text-token="title-md" class="font-title text-title-md">CSC 305 · Operating Systems</span>
          <input type="checkbox" checked class="w-[24px] h-[24px] rounded text-light-primary dark:text-dark-primary focus:ring-0">
        </label>
        <label class="flex items-center justify-between min-h-[48px] px-gutter-lg py-gutter-md rounded-lg bg-light-surface-container-low dark:bg-dark-surface-container-low border border-light-outline-variant dark:border-dark-outline-variant cursor-pointer">
          <span data-design-text-token="title-md" class="font-title text-title-md">CSC 309 · Computer Networks</span>
          <input type="checkbox" checked class="w-[24px] h-[24px] rounded text-light-primary dark:text-dark-primary focus:ring-0">
        </label>
        <label class="flex items-center justify-between min-h-[48px] px-gutter-lg py-gutter-md rounded-lg bg-light-surface-container-low dark:bg-dark-surface-container-low border border-light-outline-variant dark:border-dark-outline-variant cursor-pointer">
          <span data-design-text-token="title-md" class="font-title text-title-md">SE 312 · Software Testing</span>
          <input type="checkbox" class="w-[24px] h-[24px] rounded text-light-primary dark:text-dark-primary focus:ring-0">
        </label>
      </div>
    </main>

    <!-- Step 3: Done -->
    <main id="step-3" class="hidden flex-1 flex flex-col justify-center gap-gutter-lg py-gutter-lg">
      <div class="w-[56px] h-[56px] rounded-full bg-light-primary-container dark:bg-dark-primary-container text-light-on-primary-container dark:text-dark-on-primary-container flex items-center justify-center">
        <span class="material-symbols-outlined text-[28px]" aria-hidden="true">check</span>
      </div>
      <div class="flex flex-col gap-gutter-xs">
        <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-light-on-surface dark:text-dark-on-surface">You are all set</h1>
        <p data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant dark:text-dark-on-surface-variant">Your timetable is saved offline. You can change units anytime in Settings.</p>
      </div>
    </main>

    <!-- Bottom Thumb-Zone Action -->
    <footer class="pt-gutter-md pb-[env(safe-area-inset-bottom)]">
      <button id="next-step-btn" type="button" onclick="nextStep()" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full inline-flex items-center justify-center min-h-[48px] px-gutter-xl rounded-lg bg-light-primary dark:bg-dark-primary text-light-on-primary dark:text-dark-on-primary font-label text-label-lg active:opacity-80">
        <span id="next-step-label" data-design-text-token="label-lg">Continue to units</span>
      </button>
    </footer>

  </div>

  <script>
    let step = 1;

    function filterCourses() {
      const q = document.getElementById('course-search').value.toLowerCase();
      document.querySelectorAll('.course-option').forEach(function (btn) {
        btn.classList.toggle('hidden', q && btn.textContent.toLowerCase().indexOf(q) === -1);
      });
    }

    function pickCourse(name) {
      nextStep();
    }

    function nextStep() {
      if (step === 1) {
        step = 2;
        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('step-2').classList.remove('hidden');
        document.getElementById('dot-1').className = 'w-[8px] h-[8px] rounded-full bg-light-primary dark:bg-dark-primary';
        document.getElementById('dot-2').className = 'w-[24px] h-[8px] rounded-full bg-light-primary dark:bg-dark-primary';
        document.getElementById('next-step-label').textContent = 'Save timetable';
      } else if (step === 2) {
        step = 3;
        document.getElementById('step-2').classList.add('hidden');
        document.getElementById('step-3').classList.remove('hidden');
        document.getElementById('dot-2').className = 'w-[8px] h-[8px] rounded-full bg-light-primary dark:bg-dark-primary';
        document.getElementById('dot-3').className = 'w-[24px] h-[8px] rounded-full bg-light-primary dark:bg-dark-primary';
        document.getElementById('next-step-label').textContent = 'Open Today';
      } else {
        window.location.href = '../today/Today.html';
      }
    }
  </script>


</body></html>
