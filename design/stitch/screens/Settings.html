  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&amp;family=Geist:wght@400;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-light-background dark:bg-dark-background text-light-on-background dark:text-dark-on-background font-body antialiased">
  <div class="max-w-[430px] mx-auto min-h-[884px] flex flex-col bg-light-surface dark:bg-dark-surface text-light-on-surface dark:text-dark-on-surface relative" data-stitch-vh="min-h-[884px]===min-h-screen">

    <header class="sticky top-0 z-20 bg-light-surface dark:bg-dark-surface border-b border-light-outline-variant dark:border-dark-outline-variant px-page-margin py-gutter-md">
      <h1 data-design-text-token="headline-md" class="font-headline text-headline-md text-light-on-surface dark:text-dark-on-surface">Settings</h1>
    </header>

    <main class="flex-1 px-page-margin pt-gutter-lg pb-[88px] flex flex-col gap-gutter-lg">

      <!-- Appearance & Battery -->
      <section class="flex flex-col gap-gutter-md">
        <h2 data-design-text-token="label-lg" class="font-label text-label-lg text-light-on-surface-variant dark:text-dark-on-surface-variant">Display &amp; battery</h2>

        <label data-component-id="toggle-description-on" data-component-type="toggle" data-component-variant="with-description" class="flex items-center justify-between gap-gutter-md min-h-[48px] p-gutter-lg rounded-lg bg-light-surface-container-low dark:bg-dark-surface-container-low border border-light-outline-variant dark:border-dark-outline-variant cursor-pointer">
          <div class="flex flex-col gap-gutter-xs">
            <span data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface dark:text-dark-on-surface">Dark theme (OLED)</span>
            <span data-design-text-token="label-md" class="font-body text-label-md text-light-on-surface-variant dark:text-dark-on-surface-variant">Saves battery; switch off for bright sunlight</span>
          </div>
          <button id="theme-switch" type="button" role="switch" aria-checked="true" onclick="toggleTheme()" class="relative inline-flex shrink-0 items-center w-[52px] h-[32px] rounded-full bg-light-primary dark:bg-dark-primary transition-colors duration-state-change">
            <span id="theme-thumb" class="inline-block w-[24px] h-[24px] translate-x-[24px] rounded-full bg-light-on-primary dark:bg-dark-on-primary transition-transform duration-state-change"></span>
          </button>
        </label>

        <label data-component-id="toggle-description" data-component-type="toggle" data-component-variant="with-description" class="flex items-center justify-between gap-gutter-md min-h-[48px] p-gutter-lg rounded-lg bg-light-surface-container-low dark:bg-dark-surface-container-low border border-light-outline-variant dark:border-dark-outline-variant cursor-pointer">
          <div class="flex flex-col gap-gutter-xs">
            <span data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface dark:text-dark-on-surface">Data saver mode</span>
            <span data-design-text-token="label-md" class="font-body text-label-md text-light-on-surface-variant dark:text-dark-on-surface-variant">Load your course only</span>
          </div>
          <button id="saver-switch" type="button" role="switch" aria-checked="true" onclick="toggleSwitch(&#39;saver-switch&#39;)" class="relative inline-flex shrink-0 items-center w-[52px] h-[32px] rounded-full bg-light-primary dark:bg-dark-primary transition-colors duration-state-change">
            <span class="inline-block w-[24px] h-[24px] translate-x-[24px] rounded-full bg-light-on-primary dark:bg-dark-on-primary transition-transform duration-state-change"></span>
          </button>
        </label>
      </section>

      <!-- Reminders -->
      <section class="flex flex-col gap-gutter-md">
        <h2 data-design-text-token="label-lg" class="font-label text-label-lg text-light-on-surface-variant dark:text-dark-on-surface-variant">Notifications</h2>

        <label data-component-id="toggle-description" data-component-type="toggle" data-component-variant="with-description" class="flex items-center justify-between gap-gutter-md min-h-[48px] p-gutter-lg rounded-lg bg-light-surface-container-low dark:bg-dark-surface-container-low border border-light-outline-variant dark:border-dark-outline-variant cursor-pointer">
          <div class="flex flex-col gap-gutter-xs">
            <span data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface dark:text-dark-on-surface">30-minute class reminder</span>
            <span data-design-text-token="label-md" class="font-body text-label-md text-light-on-surface-variant dark:text-dark-on-surface-variant">Alert 30m before first class</span>
          </div>
          <button id="reminder-switch" type="button" role="switch" aria-checked="false" onclick="toggleReminder()" class="relative inline-flex shrink-0 items-center w-[52px] h-[32px] rounded-full bg-light-surface-variant dark:bg-dark-surface-variant border border-light-outline dark:border-dark-outline transition-colors duration-state-change">
            <span class="inline-block w-[24px] h-[24px] translate-x-[3px] rounded-full bg-light-on-surface-variant dark:bg-dark-on-surface-variant transition-transform duration-state-change"></span>
          </button>
        </label>
      </section>

      <!-- Share & Install -->
      <section class="flex flex-col gap-gutter-md">
        <h2 data-design-text-token="label-lg" class="font-label text-label-lg text-light-on-surface-variant dark:text-dark-on-surface-variant">Share &amp; install</h2>

        <button type="button" data-component-id="button-with-icon" data-component-type="button" data-component-variant="with-icon" onclick="shareApp()" class="w-full inline-flex items-center justify-center gap-gutter-sm min-h-[48px] px-gutter-lg rounded-lg bg-light-primary dark:bg-dark-primary text-light-on-primary dark:text-dark-on-primary font-label text-label-lg active:opacity-80">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">share</span>
          <span data-design-text-token="label-lg">Share timetable via WhatsApp</span>
        </button>

        <a href="../onboarding/Onboarding.html" class="w-full inline-flex items-center justify-center gap-gutter-sm min-h-[48px] px-gutter-lg rounded-lg bg-light-secondary-container dark:bg-dark-secondary-container text-light-on-secondary-container dark:text-dark-on-secondary-container font-label text-label-lg active:opacity-80">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">tune</span>
          <span data-design-text-token="label-lg">Change course or units</span>
        </a>
      </section>

    </main>

    <!-- Bottom Tab Bar -->
    <nav aria-label="Primary navigation" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] z-30 bg-light-surface-container dark:bg-dark-surface-container border-t border-light-outline-variant dark:border-dark-outline-variant pb-[env(safe-area-inset-bottom)]">
      <div class="grid grid-cols-4 h-[56px]">
        <a href="../today/Today.html" class="flex flex-col items-center justify-center min-h-[48px] text-light-on-surface-variant dark:text-dark-on-surface-variant">
          <span class="material-symbols-outlined text-[22px]" aria-hidden="true">today</span>
          <span data-design-text-token="label-sm" class="font-label text-label-sm">Today</span>
        </a>
        <a href="../week/Week.html" class="flex flex-col items-center justify-center min-h-[48px] text-light-on-surface-variant dark:text-dark-on-surface-variant">
          <span class="material-symbols-outlined text-[22px]" aria-hidden="true">date_range</span>
          <span data-design-text-token="label-sm" class="font-label text-label-sm">Week</span>
        </a>
        <a href="../browse/Browse.html" class="flex flex-col items-center justify-center min-h-[48px] text-light-on-surface-variant dark:text-dark-on-surface-variant">
          <span class="material-symbols-outlined text-[22px]" aria-hidden="true">search</span>
          <span data-design-text-token="label-sm" class="font-label text-label-sm">Browse</span>
        </a>
        <a href="Settings.html" aria-current="page" class="flex flex-col items-center justify-center min-h-[48px] text-light-primary dark:text-dark-primary">
          <span class="material-symbols-outlined text-[22px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">settings</span>
          <span data-design-text-token="label-sm" class="font-label text-label-sm">Settings</span>
        </a>
      </div>
    </nav>

  </div>

  <script>
    function setSwitchUI(btn, on) {
      btn.setAttribute('aria-checked', on ? 'true' : 'false');
      const thumb = btn.querySelector('span');
      if (on) {
        btn.className = 'relative inline-flex shrink-0 items-center w-[52px] h-[32px] rounded-full bg-light-primary dark:bg-dark-primary transition-colors duration-state-change';
        thumb.className = 'inline-block w-[24px] h-[24px] translate-x-[24px] rounded-full bg-light-on-primary dark:bg-dark-on-primary transition-transform duration-state-change';
      } else {
        btn.className = 'relative inline-flex shrink-0 items-center w-[52px] h-[32px] rounded-full bg-light-surface-variant dark:bg-dark-surface-variant border border-light-outline dark:border-dark-outline transition-colors duration-state-change';
        thumb.className = 'inline-block w-[24px] h-[24px] translate-x-[3px] rounded-full bg-light-on-surface-variant dark:bg-dark-on-surface-variant transition-transform duration-state-change';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      setSwitchUI(document.getElementById('theme-switch'), isDark);
    }

    function toggleSwitch(id) {
      const btn = document.getElementById(id);
      const next = btn.getAttribute('aria-checked') !== 'true';
      setSwitchUI(btn, next);
    }

    function toggleReminder() {
      const btn = document.getElementById('reminder-switch');
      const next = btn.getAttribute('aria-checked') !== 'true';
      if (next && 'Notification' in window) {
        Notification.requestPermission().catch(function(){});
      }
      setSwitchUI(btn, next);
    }

    function shareApp() {
      const msg = 'Check your class timetable offline with CampusPulse: https://campuspulse.app';
      if (navigator.share) {
        navigator.share({ title: 'CampusPulse', text: msg }).catch(function(){});
      } else {
        window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
      }
    }
  </script>


</body></html>
