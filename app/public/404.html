<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // SPA redirect for GitHub Pages
      var path = window.location.pathname;
      window.location.href = '/' + path.slice(1) + window.location.search + window.location.hash;
    </script>
  </head>
  <body></body>
</html>
